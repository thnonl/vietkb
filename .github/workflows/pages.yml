name: pages

# Publishes the landing page in `site/` to GitHub Pages. The page is static, so
# the job only uploads the folder and lets Pages serve it. Before upload it points
# the static download links at the latest release's assets, so the buttons
# download the file directly even when the page's GitHub API call fails.
# release.yml dispatches this workflow after each release.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point download links at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/${{ github.repository }}/releases/latest)
          # One link per asset suffix: the x64, arm64 and x86 setups and the .dmg.
          for suffix in _x64-setup.exe _arm64-setup.exe _x86-setup.exe _universal.dmg; do
            url=$(jq -r --arg s "$suffix" '[.assets[] | select(.name | endswith($s))][0].browser_download_url' <<< "$release")
            echo "$suffix: $url"
            [ -n "$url" ] && [ "$url" != null ] || continue
            pattern="https://github\.com/[^\"]+/releases/download/[^\"]+${suffix//./\\.}"
            for f in site/index.html site/en/index.html; do
              sed -i -E "s#$pattern#$url#g" "$f"
            done
          done
          grep -h -o 'releases/download/[^"]*' site/index.html site/en/index.html | sort | uniq -c
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
