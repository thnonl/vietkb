name: release

# Builds and publishes the Windows installer. scripts/verify-update.ps1 verifies
# the update on a real machine or in Windows Sandbox.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag_ok: ${{ steps.v.outputs.tag_ok }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: pwsh
        run: |
          $conf = Get-Content crates/vkb-app/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $conf.version
          "version=$version" >> $env:GITHUB_OUTPUT
          $tag = "${{ github.ref_name }}"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($tag -ne "v$version") {
              throw "tag $tag does not match tauri.conf.json version $version"
            }
            "tag_ok=true" >> $env:GITHUB_OUTPUT
          } else {
            "tag_ok=false" >> $env:GITHUB_OUTPUT
          }

  # test, clippy and build run in parallel; release waits for all three. The
  # shared keys match ci.yml, whose main-branch runs keep these caches warm
  # (a tag run can only restore caches saved on the default branch, and its
  # own saves are never reused, so it does not save).
  test:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Engine and backend tests
        run: cargo test --workspace --quiet

  clippy:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build the NSIS installer
        working-directory: crates/vkb-app
        run: "& ../../ui/node_modules/.bin/tauri.cmd build"

      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem target/release/bundle/nsis/*x64-setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $file) { throw "no installer was produced" }
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($file.Name)" >> $env:GITHUB_OUTPUT
          "size=$($file.Length)" >> $env:GITHUB_OUTPUT
          Write-Host "$($file.Name) — $($file.Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/release/bundle/nsis/*x64-setup.exe
          if-no-files-found: error

  release:
    needs: [meta, test, clippy, build]
    if: needs.meta.outputs.tag_ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*x64-setup.exe
          name: VietKB ${{ needs.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
