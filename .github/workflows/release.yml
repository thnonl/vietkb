name: release

# Builds and publishes the Windows installers (x64, x86, arm64) and the macOS
# universal .dmg to the same GitHub release, and the Store .msix packages as
# workflow artifacts. scripts/verify-update.ps1 verifies the Windows update on a
# real machine or in Windows Sandbox. The macOS app is signed with the
# project's self-signed certificate, not notarized
# (docs/evkey-clone-work/27-mac-decisions.md M5).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Plain bash + jq on Linux: every job (Windows and macOS) reads these outputs,
  # and none of them should need PowerShell for a version check.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag_ok: ${{ steps.v.outputs.tag_ok }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version crates/vkb-app/tauri.conf.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "tag $REF_NAME does not match tauri.conf.json version $version" >&2
              exit 1
            fi
            echo "tag_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_ok=false" >> "$GITHUB_OUTPUT"
          fi

  # test, clippy and build run in parallel; release waits for all three. The
  # shared keys match ci.yml, whose main-branch runs keep these caches warm
  # (a tag run can only restore caches saved on the default branch, and its
  # own saves are never reused, so it does not save).
  test:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Engine and backend tests
        run: cargo test --workspace --quiet

  clippy:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # One NSIS installer per Windows architecture. x64 builds for the host as it
  # always has (target/release); x86 and arm64 cross-compile with --target. Each
  # app's updater downloads the setup named for its own architecture (update.rs).
  build:
    needs: meta
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: ""
            out: target/release
            cache: release
          - arch: x86
            target: i686-pc-windows-msvc
            out: target/i686-pc-windows-msvc/release
            cache: release-x86
          - arch: arm64
            target: aarch64-pc-windows-msvc
            out: target/aarch64-pc-windows-msvc/release
            cache: release-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build the NSIS installer
        working-directory: crates/vkb-app
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $targetArgs = if ($env:TARGET) { @('--target', $env:TARGET) } else { @() }
          & ../../ui/node_modules/.bin/tauri.cmd build @targetArgs
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed ($LASTEXITCODE)" }

      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem ${{ matrix.out }}/bundle/nsis/*_${{ matrix.arch }}-setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $file) { throw "no installer was produced" }
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($file.Name)" >> $env:GITHUB_OUTPUT
          "size=$($file.Length)" >> $env:GITHUB_OUTPUT
          Write-Host "$($file.Name) — $($file.Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: ${{ matrix.out }}/bundle/nsis/*_${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  # Microsoft Store packages, one unsigned .msix per architecture (the Store
  # signs them). Kept as workflow artifacts for the Partner Center upload, never
  # attached to the GitHub release.
  store:
    needs: meta
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x86' && 'i686-pc-windows-msvc' || matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build the .msix
        shell: pwsh
        run: ./scripts/build-store.ps1 -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: target-store/store/VietKB_*_${{ matrix.arch }}.msix
          if-no-files-found: error

  # macOS: tests + clippy, then the universal .dmg. `--features custom-protocol`
  # embeds the UI like the Windows release build does.
  test-macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Engine and backend tests
        run: cargo test --workspace --quiet
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      # Signed with the project's own self-signed certificate (secrets
      # MACOS_SIGNING_P12, base64, and MACOS_SIGNING_PASSWORD). macOS keys the
      # Accessibility / Input Monitoring grants to the designated requirement;
      # with this certificate that is `identifier + certificate root`, the same
      # for every release, so an update keeps the grants. An ad-hoc signature
      # pins the cdhash instead and every update asked for the grants again.
      # Not notarized (27-mac-decisions.md M5).
      - name: Import the signing certificate
        shell: bash
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] || { echo "signing secrets are missing" >&2; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_password="$(openssl rand -hex 16)"
          printf %s "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Build the universal .app and .dmg
        working-directory: crates/vkb-app
        run: ../../ui/node_modules/.bin/tauri build --target universal-apple-darwin --features custom-protocol --config '{"bundle":{"macOS":{"signingIdentity":"VietKB"}}}'

      # Fail rather than ship an ad-hoc build: the grants would reset again.
      - name: Check the signature
        shell: bash
        run: |
          app="target/universal-apple-darwin/release/bundle/macos/VietKB.app"
          codesign --verify --deep --strict "$app"
          requirement="$(codesign -d -r- "$app" 2>&1)"
          echo "$requirement"
          grep -qF 'identifier "vn.vietkb.app" and certificate root = H"26f051435796e579c526eb1e981bfab98210064e"' <<< "$requirement"

      - name: Locate the .dmg
        shell: bash
        run: |
          file="$(ls -t target/universal-apple-darwin/release/bundle/dmg/VietKB_*_universal.dmg | head -n 1)"
          [ -n "$file" ] || { echo "no .dmg was produced" >&2; exit 1; }
          echo "$file - $(stat -f %z "$file") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: target/universal-apple-darwin/release/bundle/dmg/VietKB_*_universal.dmg
          if-no-files-found: error

  release:
    needs: [meta, test, clippy, build]
    if: needs.meta.outputs.tag_ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          name: VietKB ${{ needs.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true

  # The Windows release above never waits for macOS. This job attaches the .dmg to
  # the same release once it exists; a macOS failure leaves the Windows release
  # published and only this job red.
  release-macos:
    needs: [meta, release, test-macos, build-macos]
    if: needs.meta.outputs.tag_ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          tag_name: ${{ github.ref_name }}
          make_latest: false

  # Pages bakes the latest asset URLs into the static download links (pages.yml).
  # A release made with GITHUB_TOKEN triggers no other workflow, so dispatch it here.
  pages:
    needs: [meta, release, release-macos]
    if: always() && needs.meta.outputs.tag_ok == 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo ${{ github.repository }} --ref main
