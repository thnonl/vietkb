name: release

# Builds and publishes the Windows installer and the macOS universal .dmg to the
# same GitHub release. scripts/verify-update.ps1 verifies the Windows update on a
# real machine or in Windows Sandbox. The macOS app is ad-hoc signed, not
# notarized (docs/evkey-clone-work/27-mac-decisions.md M5).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Plain bash + jq on Linux: every job (Windows and macOS) reads these outputs,
  # and none of them should need PowerShell for a version check.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag_ok: ${{ steps.v.outputs.tag_ok }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version crates/vkb-app/tauri.conf.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "tag $REF_NAME does not match tauri.conf.json version $version" >&2
              exit 1
            fi
            echo "tag_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_ok=false" >> "$GITHUB_OUTPUT"
          fi

  # test, clippy and build run in parallel; release waits for all three. The
  # shared keys match ci.yml, whose main-branch runs keep these caches warm
  # (a tag run can only restore caches saved on the default branch, and its
  # own saves are never reused, so it does not save).
  test:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Engine and backend tests
        run: cargo test --workspace --quiet

  clippy:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build the NSIS installer
        working-directory: crates/vkb-app
        run: "& ../../ui/node_modules/.bin/tauri.cmd build"

      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $file = Get-ChildItem target/release/bundle/nsis/*x64-setup.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $file) { throw "no installer was produced" }
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($file.Name)" >> $env:GITHUB_OUTPUT
          "size=$($file.Length)" >> $env:GITHUB_OUTPUT
          Write-Host "$($file.Name) — $($file.Length) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/release/bundle/nsis/*x64-setup.exe
          if-no-files-found: error

  # macOS: tests + clippy, then the universal .dmg. `--features custom-protocol`
  # embeds the UI like the Windows release build does.
  test-macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Engine and backend tests
        run: cargo test --workspace --quiet
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      # Ad-hoc signed (`signingIdentity: "-"` in tauri.macos.conf.json), so the
      # Accessibility grant sticks to the bundle. Not notarized.
      - name: Build the universal .app and .dmg
        working-directory: crates/vkb-app
        run: ../../ui/node_modules/.bin/tauri build --target universal-apple-darwin --features custom-protocol

      - name: Locate the .dmg
        shell: bash
        run: |
          file="$(ls -t target/universal-apple-darwin/release/bundle/dmg/VietKB_*_universal.dmg | head -n 1)"
          [ -n "$file" ] || { echo "no .dmg was produced" >&2; exit 1; }
          echo "$file - $(stat -f %z "$file") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: target/universal-apple-darwin/release/bundle/dmg/VietKB_*_universal.dmg
          if-no-files-found: error

  release:
    needs: [meta, test, clippy, build, test-macos, build-macos]
    if: needs.meta.outputs.tag_ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*x64-setup.exe
            dist/*.dmg
          name: VietKB ${{ needs.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
