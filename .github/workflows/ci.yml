name: ci

# Tests, lints and a release build on every push to main. Besides checking
# each commit, this keeps the Rust caches warm in main's scope: a tag run can
# only restore caches saved on the default branch, so without this job every
# release compiled all dependencies from scratch. The shared keys below must
# match the ones in release.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "design/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Node 24: `test:i18n` imports the .ts locale files, which needs Node's
      # built-in type stripping (on by default from 22.18 / 23.6).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI strings and types
        run: npm --prefix ui ci && npm --prefix ui run test:i18n && npm --prefix ui run check
      - name: Engine and backend tests
        run: cargo test --workspace --quiet

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: Release build (no installer)
        working-directory: crates/vkb-app
        run: "& ../../ui/node_modules/.bin/tauri.cmd build --no-bundle"

  # macOS: engine/app tests and clippy in one job (the Mac runner is the slow,
  # scarce one). Same commands as the Windows jobs above. No installer here; the
  # universal .dmg is built by release.yml.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI strings and types
        run: npm --prefix ui ci && npm --prefix ui run test:i18n && npm --prefix ui run check
      - name: Engine and backend tests
        run: cargo test --workspace --quiet
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
