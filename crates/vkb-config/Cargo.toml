[package]
name = "vkb-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Side-by-side test channel: everything lands under `VietKB Dev` instead of
# `VietKB`, so a test build can never read or write the installed app's state.
# Off by default; production builds are unchanged.
dev-channel = []

[dependencies]
vkb-core = { path = "../vkb-core" }
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
dirs = "5"
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
