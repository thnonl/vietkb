[package]
name = "vietkb-gui"
version = "0.1.1"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = "1.0.150"
tauri = { version = "2", features = ["image-ico", "tray-icon"] }
tauri-plugin-updater = "2"
vietkb-config = { path = "../vietkb-config" }
vietkb-core = { path = "../vietkb-core" }
vietkb-ui = { path = "../vietkb-ui" }
vietkb-windows = { path = "../vietkb-windows" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
