[package]
name = "vietkb-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
native-windows-gui = "1.0"
vietkb-config = { path = "../vietkb-config" }
vietkb-core = { path = "../vietkb-core" }
vietkb-ui = { path = "../vietkb-ui" }
vietkb-windows = { path = "../vietkb-windows" }
winapi = { version = "0.3", features = ["winuser"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
