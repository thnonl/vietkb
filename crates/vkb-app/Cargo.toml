[package]
name = "vkb-app"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vietkb"
path = "src/main.rs"

# Embeds `frontendDist` (../../ui/dist) into the binary and serves it over the
# `tauri://localhost` custom protocol. Release/official builds only:
# `cargo build --release --features custom-protocol`. Deliberately NOT a default
# feature, so `tauri dev` keeps using `build.devUrl`.
[features]
custom-protocol = ["tauri/custom-protocol"]
# Side-by-side test channel: config dir `VietKB Dev`, own `Run` value, own
# bundle identity (see `tauri.dev.conf.json`). Never enabled for production.
dev-channel = ["vkb-config/dev-channel"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vkb-core = { path = "../vkb-core" }
vkb-config = { path = "../vkb-config" }
vkb-platform = { path = "../vkb-platform" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
unicode-normalization.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "common-controls-v6"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ureq = { version = "3.2.1", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
vkb-windows = { path = "../vkb-windows" }
# Window enumeration for the per-app picker (same version tauri already pulls).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
vkb-macos = { path = "../vkb-macos" }

