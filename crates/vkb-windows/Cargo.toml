[package]
name = "vkb-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Test seam for the zero-focus hook sandwich (`examples/zero_focus_e2e.rs`). Off in
# every shipped build; see `src/e2e.rs`.
e2e-harness = ["windows/Win32_System_Diagnostics_ToolHelp"]

# D-WIN-09 measurement build: reads VKB_INJECT_STRATEGY (src/input_dev.rs). Off in
# every release build; vkb-app's `dev-channel` forwards to it.
dev-channel = []

[[example]]
name = "zero_focus_e2e"
required-features = ["e2e-harness"]

[target.'cfg(windows)'.dependencies]
vkb-core = { path = "../vkb-core" }
vkb-config = { path = "../vkb-config" }
vkb-platform = { path = "../vkb-platform" }
anyhow.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
tracing.workspace = true
toml.workspace = true
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Ime",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_ProcessStatus",
  "Win32_System_DataExchange",
  "Win32_Graphics_Gdi",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Console",
  "Win32_Media_Audio",
  "Win32_System_Console",
] }
