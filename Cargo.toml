[workspace]
resolver = "2"
members = [
  "crates/vkb-core",
  "crates/vkb-config",
  "crates/vkb-platform",
  "crates/vkb-windows",
  "crates/vkb-macos",
  "crates/vkb-app",
  "crates/vkb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/local/vietkb"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
smallvec = "1"
parking_lot = "0.12"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Fast typing feedback in dev: engine tests should stay snappy.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
opt-level = 3
lto = "thin"
